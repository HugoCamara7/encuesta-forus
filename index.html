<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Encuestas Forus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="cabecera">
  <button id="btn-atras" class="btn-atras" type="button" aria-label="Volver" hidden>‹</button>

  <div class="cabecera-marca">
    <img class="logo-forus" src="icons/forus-logo-blanco.png" alt="Forus">
    <div class="cabecera-sep"></div>
    <div class="cabecera-txt">
      <h1 id="titulo-vista">Activaciones</h1>
      <span id="version" class="version"></span>
    </div>
  </div>

  <div class="cabecera-der">
    <span id="marca-cabecera" class="marca-cabecera" hidden></span>
    <span id="estado-red" class="chip-red" title="Estado de la conexion"></span>
  </div>
</header>

<nav id="pestanas" class="pestanas">
  <button id="tab-inicio"     class="pestana activa" type="button">Activaciones</button>
  <button id="tab-resultados" class="pestana"        type="button">Resultados</button>
  <button id="tab-ajustes"    class="pestana"        type="button">Ajustes</button>
</nav>

<div id="aviso" class="aviso" role="status" aria-live="polite"></div>

<main id="contenido"></main>

<div id="barra-accion" class="barra-guardar" hidden></div>

<dialog id="detalle" class="detalle">
  <div class="detalle-cab">
    <strong>Detalle de la respuesta</strong>
    <button id="cerrar-detalle" class="boton secundario chico" type="button">Cerrar</button>
  </div>
  <div id="detalle-cuerpo"></div>
</dialog>

<!-- Datos y reglas (se editan para agregar preguntas, plantillas o marcas) -->
<script src="js/config.js"></script>
<script src="js/banco-preguntas.js"></script>
<script src="js/plantillas.js"></script>
<script src="js/marcas.js"></script>

<!-- Motor (no se edita) -->
<script src="js/validacion.js"></script>
<script src="js/campos.js"></script>
<script src="js/db.js"></script>
<script src="js/zip.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>

<script>
/* ---- Indicador de conexion (informativo: la app funciona igual sin red) ---- */
(function () {
  var chip = document.getElementById('estado-red');
  function pintar() {
    var enLinea = navigator.onLine;
    chip.textContent = enLinea ? 'En linea' : 'Sin conexion';
    chip.className = 'chip-red ' + (enLinea ? 'en-linea' : 'sin-linea');
  }
  window.addEventListener('online', pintar);
  window.addEventListener('offline', pintar);
  pintar();
})();

/* ---- Instalacion: se guarda el evento para el boton de Ajustes ---- */
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  window.__instalacionPendiente = e;
});

window.addEventListener('appinstalled', function () {
  window.__instalacionPendiente = null;
  var a = document.getElementById('ayuda-instalar');
  if (a) a.textContent = 'La aplicacion ya esta instalada en esta tablet.';
});

/* ---- Service Worker: es lo que permite abrir la app sin internet ---- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('No se pudo registrar el modo offline:', e);
    });
  });
}
</script>

</body>
</html>
